name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        # Default ubuntu-latest: the repo has 0 registered self-hosted runners.
        # Choosing self-hosted requires labels [self-hosted, ts] online or jobs queue forever.
        description: "Runner type"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
  schedule:
    - cron: "0 */6 * * *"

# Cancela ejecuciones en curso de la misma rama cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner-health:
    if: github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted'
    runs-on: [self-hosted, ts]
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Connectivity check
        run: |
          echo "::notice::Runner: $(hostname) | Kernel: $(uname -r)"
          echo "::notice::Docker: $(docker --version 2>/dev/null || echo 'N/A')"
          curl -so /dev/null -w "api.github.com: %{http_code} (%{time_total}s)\n" \
            https://api.github.com
          curl -so /dev/null -w "broker: %{http_code} (%{time_total}s)\n" \
            https://broker.actions.githubusercontent.com
      - name: Host resources
        run: |
          echo "::notice::CPU: $(nproc) cores, load: $(uptime | awk -F'average:' '{print $2}' | xargs)"
          echo "::notice::RAM: $(free -h | awk '/^Mem:/{print $3 "/" $2 " used"}')"
          echo "::notice::Disk: $(df -h / | awk 'NR==2{print $3 "/" $2 " (" $5 ")"}')"
          if command -v nvidia-smi &>/dev/null; then
            echo "::notice::GPU: $(nvidia-smi --query-gpu=temperature.gpu,memory.used,memory.total --format=csv,noheader 2>/dev/null || echo 'N/A')"
          fi
      - name: Check broker health from logs
        run: |
          RECENT=$(find /actions-runner/_diag/ -name 'Runner_*.log' -mmin -3 | sort | tail -1)
          if [ -n "$RECENT" ]; then
            ERRORS=$(grep -c 'ERR.*BrokerServer' "$RECENT" 2>/dev/null || echo 0)
            if [ "$ERRORS" -gt 0 ]; then
              echo "::warning::Broker errors in last 3 min: ${ERRORS}"
            else
              echo "::notice::Broker healthy (0 errors)"
            fi
          else
            echo "::warning::No recent runner logs found"
          fi

  quality:
    name: quality
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && fromJSON('["self-hosted","ts"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Validate GH Action SHAs exist in their repos
        run: npm run verify:action-shas
      - name: Verify vercel.json config consistency
        run: npm run verify:vercel
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - name: Audit production dependencies
        # Informativo: Next.js 16 + transitivas reportan high/critical que no
        # aplican al export estático (sin middleware, Server Actions ni image
        # optimizer). No se hace gate para no forzar un bump de producto.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  test:
    name: test
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && fromJSON('["self-hosted","ts"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Unit tests + coverage gate
        run: npm run test -- --coverage

  build:
    name: build
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && fromJSON('["self-hosted","ts"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: static-export
          path: out/
          if-no-files-found: error
          retention-days: 3

  smoke:
    name: smoke
    needs: [build]
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && fromJSON('["self-hosted","ts"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: static-export
          path: out/
      - name: Smoke — servir export y comprobar rutas
        run: npm run smoke

  e2e:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && fromJSON('["self-hosted","ts"]') || 'ubuntu-latest' }}
    needs: [quality, test, build]
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  lhci:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && fromJSON('["self-hosted","ts"]') || 'ubuntu-latest' }}
    needs: [quality, test, build]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate JSON-LD
        run: npm run validate-jsonld
      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  a11y:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && fromJSON('["self-hosted","ts"]') || 'ubuntu-latest' }}
    needs: [quality, test, build]
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run a11y tests (contraste + axe-core)
        run: npm run test:a11y
        env:
          CI: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: a11y-report
          path: test-results/
          retention-days: 7

  perf:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && fromJSON('["self-hosted","ts"]') || 'ubuntu-latest' }}
    needs: [quality, test, build]
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run performance audit (Web Vitals)
        run: node scripts/perf-audit.mjs
        env:
          CI: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: perf-report
          path: perf-reports/
          retention-days: 7

  deploy:
    # Always report a status so branch protection's required "deploy" check can pass on PRs.
    # Production deploy only runs on push to main; PRs get a successful no-op.
    if: always() && needs.quality.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' && needs.smoke.result == 'success' && needs.e2e.result == 'success' && needs.lhci.result == 'success' && needs.a11y.result == 'success' && needs.perf.result == 'success'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && fromJSON('["self-hosted","ts"]') || 'ubuntu-latest' }}
    needs: [quality, test, build, smoke, e2e, lhci, a11y, perf]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Skip production deploy on pull requests
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: echo "Skipping production deploy (not a push to main)."

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

      - name: Deploy to Vercel (production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            npx vercel deploy --prod --token "${{ secrets.VERCEL_TOKEN }}" --scope alexendros-team --yes
          else
            echo "::warning::VERCEL_TOKEN not set in repo secrets. Skipping deploy."
            echo "::warning::Set VERCEL_TOKEN at https://github.com/Iniciativas-Alexendros/website-alexendrosme/settings/secrets/actions"
            echo "::warning::Token can be created at https://vercel.com/account/tokens"
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  pr-summary:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [quality, test, build, smoke, e2e, lhci, a11y, perf]
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: write
    steps:
      - id: check-all
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          LHCI_RESULT: ${{ needs.lhci.result }}
          A11Y_RESULT: ${{ needs.a11y.result }}
          PERF_RESULT: ${{ needs.perf.result }}
        with:
          script: |
            const statusIcon = (r) => {
              if (r === 'success') return '✅';
              if (r === 'failure') return '❌';
              if (r === 'cancelled') return '⏭️';
              return '❓';
            };

            const checks = [
              { name: '**quality** (format, typecheck, lint, verify, audit)', result: process.env.QUALITY_RESULT },
              { name: '**test** (Vitest + coverage)', result: process.env.TEST_RESULT },
              { name: '**build** (export estático `out/`)', result: process.env.BUILD_RESULT },
              { name: '**smoke** (rutas canónicas del export)', result: process.env.SMOKE_RESULT },
              { name: '**E2E Tests** (Playwright)', result: process.env.E2E_RESULT },
              { name: '**Lighthouse CI** (rendimiento, accesibilidad, SEO)', result: process.env.LHCI_RESULT },
              { name: '**A11y** (contraste WCAG + axe-core)', result: process.env.A11Y_RESULT },
              { name: '**Perf** (Web Vitals: FCP, LCP, CLS)', result: process.env.PERF_RESULT },
            ];

            const allPassed = checks.every(c => c.result === 'success');
            core.setOutput('all-passed', allPassed ? 'true' : 'false');

            let body = `## CI Checklist\n\n`;
            body += `| Check | Status |\n`;
            body += `|---|---|\n`;
            for (const c of checks) {
              body += `| ${c.name} | ${statusIcon(c.result)} |\n`;
            }
            body += `\n**Resultado:** ${allPassed ? '✅ Todos los checks pasaron — listo para merge.' : '❌ Algunos checks fallaron — revisa antes de mergear.'}\n`;
            body += `\n---\n_Actualizado automáticamente por el workflow CI._\n`;

            const issueNumber = context.issue.number || context.payload.pull_request?.number;
            if (!issueNumber) {
              console.log('Not a pull request — skipping comment.');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: issueNumber,
            });

            const existing = comments.find(c =>
              c.body.includes('## CI Checklist') &&
              c.user.type === 'Bot'
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body,
              });
            }

      - name: Enable auto-merge
        if: steps.check-all.outputs.all-passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge --auto --merge "$PR_NUMBER" \
            --repo "$REPO" \
            --subject "$PR_TITLE"
